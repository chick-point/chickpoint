<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chick Point - Manajemen Produk</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/batik-pattern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        .hidden-role { display: none !important; }

        .btn-theme-toggle {
            background: none;
            border: 2px solid var(--accent);
            color: var(--text-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-theme-toggle:hover {
            background: var(--accent);
            color: white;
            transform: rotate(15deg);
        }
        body.dark-mode .btn-theme-toggle {
            border-color: #C9A84C;
            color: #C9A84C;
        }
        body.dark-mode .btn-theme-toggle:hover {
            background: #C9A84C;
            color: #121212;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .search-container {
            position: relative;
            flex: 1;
            max-width: 300px;
        }
        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
        }
        .search-container input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 2px solid #e5e7eb;
            border-radius: 50px;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            background: white;
            transition: all 0.3s;
        }
        body.dark-mode .search-container input {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .search-container input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 2px 8px rgba(201,168,76,0.15);
        }

        .table-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .dropdown-style {
            padding: 10px 16px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: white;
            cursor: pointer;
            outline: none;
            min-width: 150px;
            transition: all 0.2s;
        }
        body.dark-mode .dropdown-style {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .dropdown-style:focus {
            border-color: var(--primary);
        }
        body.dark-mode .dropdown-style:focus {
            border-color: #C9A84C;
        }
        .dropdown-style:hover {
            border-color: var(--primary);
        }

        .btn-approval-stok {
            background: #fef3c7;
            color: #d97706;
            border: 2px solid #d97706;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            white-space: nowrap;
            position: relative;
        }
        .btn-approval-stok:hover {
            background: #d97706;
            color: white;
            transform: translateY(-2px);
        }
        body.dark-mode .btn-approval-stok {
            background: #3a3a1a;
            border-color: #fbbf24;
            color: #fbbf24;
        }
        body.dark-mode .btn-approval-stok:hover {
            background: #fbbf24;
            color: #121212;
        }
        .btn-approval-stok .badge-count {
            background: #dc2626;
            color: white;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 700;
            line-height: 20px;
            min-width: 20px;
            text-align: center;
        }

        input[type="text"].format-angka {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .btn-action-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 14px;
        }
        .btn-icon:hover { transform: scale(1.1); }
        .btn-icon.btn-edit { background: #dbeafe; color: #2563eb; }
        .btn-icon.btn-toggle { background: #dcfce7; color: #16a34a; }
        .btn-icon.btn-delete { background: #fee2e2; color: #dc2626; }
        body.dark-mode .btn-icon.btn-edit { background: #1a2a3a; color: #60a5fa; }
        body.dark-mode .btn-icon.btn-toggle { background: #1a3a2a; color: #4ade80; }
        body.dark-mode .btn-icon.btn-delete { background: #3a1a1a; color: #f87171; }

        .product-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f5f5f5;
            color: #888;
            font-size: 18px;
        }
        body.dark-mode .product-icon {
            background: #2a2a2a;
            color: #aaa;
        }

        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.active { background: #dcfce7; color: #16a34a; }
        .status-badge.inactive { background: #fee2e2; color: #dc2626; }
        body.dark-mode .status-badge.active { background: #1a3a2a; color: #4ade80; }
        body.dark-mode .status-badge.inactive { background: #3a1a1a; color: #f87171; }

        .modal { max-width: 800px; }
        body.dark-mode .modal {
            background: #1e1e1e;
            border-color: #333;
        }
        body.dark-mode .modal h2 {
            color: #C9A84C;
        }
        body.dark-mode .modal .form-group label {
            color: #ddd;
        }
        body.dark-mode .modal .form-group input,
        body.dark-mode .modal .form-group select,
        body.dark-mode .modal .form-group textarea {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        body.dark-mode .modal .form-group input:focus,
        body.dark-mode .modal .form-group select:focus,
        body.dark-mode .modal .form-group textarea:focus {
            border-color: #C9A84C;
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .margin-info {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            padding: 4px 8px;
            background: #f5f5f5;
            border-radius: 6px;
            display: inline-block;
        }
        body.dark-mode .margin-info {
            background: #2a2a2a;
            color: #aaa;
        }
        .margin-info.positive { color: #16a34a; background: #dcfce7; }
        .margin-info.negative { color: #dc2626; background: #fee2e2; }
        body.dark-mode .margin-info.positive { background: #1a3a2a; color: #4ade80; }
        body.dark-mode .margin-info.negative { background: #3a1a1a; color: #f87171; }

        .btn-header-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-category-header {
            background: var(--secondary);
            color: var(--primary);
            border: 2px solid var(--accent);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        body.dark-mode .btn-category-header {
            background: #2a2a2a;
            color: #C9A84C;
            border-color: #444;
        }
        .btn-category-header:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }
        body.dark-mode .btn-category-header:hover {
            background: #C9A84C;
            color: #121212;
        }

        .approval-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--secondary);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: var(--transition);
            gap: 12px;
        }
        body.dark-mode .approval-item {
            background: #2a2a2a;
            border-color: #333;
        }
        .approval-item:hover {
            border-color: var(--accent);
        }
        .approval-item .info {
            flex: 1;
            min-width: 0;
        }
        .approval-item .info .name {
            font-weight: 600;
            font-size: 14px;
            word-break: break-word;
            margin-bottom: 6px;
        }
        .approval-item .info .detail {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }
        body.dark-mode .approval-item .info .detail {
            color: #aaa;
        }
        .approval-item .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-approve {
            background: #22c55e;
            color: white;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-approve:hover {
            transform: scale(1.1);
            background: #16a34a;
        }
        .btn-reject {
            background: #ef4444;
            color: white;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-reject:hover {
            transform: scale(1.1);
            background: #dc2626;
        }
        .approval-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }

        .category-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
        }
        body.dark-mode .category-list {
            border-color: #444;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        body.dark-mode .category-item {
            border-bottom-color: #333;
        }
        .category-item:last-child { border-bottom: none; }
        .category-item .cat-name { font-weight: 500; }
        .category-item .cat-actions { display: flex; gap: 6px; }
        .category-item .cat-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .category-item .cat-actions .cat-edit:hover { background: #dbeafe; color: #2563eb; }
        .category-item .cat-actions .cat-delete:hover { background: #fee2e2; color: #dc2626; }
        body.dark-mode .category-item .cat-actions .cat-edit:hover { background: #1a2a3a; color: #60a5fa; }
        body.dark-mode .category-item .cat-actions .cat-delete:hover { background: #3a1a1a; color: #f87171; }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-sm:hover { transform: translateY(-1px); }
        .btn-sm.btn-primary-sm { background: var(--primary); color: white; }
        .btn-sm.btn-primary-sm:hover { background: var(--primary-dark); }
        body.dark-mode .btn-sm.btn-primary-sm { background: #C9A84C; color: #121212; }
        body.dark-mode .btn-sm.btn-primary-sm:hover { background: #b8962a; }

        .category-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .category-edit-row input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        body.dark-mode .category-edit-row input {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .category-edit-row input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .category-edit-row input:disabled {
            background: #f5f5f5;
            color: #999;
        }
        body.dark-mode .category-edit-row input:disabled {
            background: #1a1a1a;
            color: #666;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-container {
            background: white;
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.dark-mode .table-container {
            background: #1e1e1e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th {
            background: var(--secondary);
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--primary);
            font-size: 12px;
            white-space: nowrap;
        }
        body.dark-mode th {
            background: #2a2a2a;
            color: #C9A84C;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
            color: var(--text-dark);
        }
        body.dark-mode td {
            border-bottom-color: #333;
        }

        .filter-approval {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }
        .filter-approval select {
            padding: 8px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            background: white;
            min-width: 150px;
        }
        body.dark-mode .filter-approval select {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .filter-approval select:focus {
            border-color: var(--accent);
            outline: none;
        }
        .btn-refresh-approval {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #dbeafe;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh-approval:hover {
            background: #2563eb;
            color: white;
        }
        body.dark-mode .btn-refresh-approval {
            background: #1a2a3a;
            color: #60a5fa;
        }
        body.dark-mode .btn-refresh-approval:hover {
            background: #60a5fa;
            color: #121212;
        }

        @media (max-width: 768px) {
            .modal .form-row { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: stretch; }
            .table-actions { flex-direction: column; }
            .search-container { max-width: 100%; }
            .btn-header-group { flex-direction: column; width: 100%; }
            .btn-header-group .btn-primary,
            .btn-header-group .btn-category-header { width: 100%; justify-content: center; }
            .category-edit-row { flex-direction: column; }
            .category-edit-row input { width: 100%; }
            table { min-width: 600px; }
            table th, table td { padding: 6px 8px; font-size: 10px; }
            .header-actions { flex-wrap: wrap; }
            .approval-item { flex-wrap: nowrap; }
            .btn-approval-stok { width: 100%; justify-content: center; }
            .filter-approval { flex-direction: column; }
            .filter-approval select { width: 100%; }
            .modal { max-width: 95%; padding: 16px; }
        }

        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            table { min-width: 480px; }
            table th, table td { padding: 4px 6px; font-size: 9px; }
            .btn-theme-toggle { width: 36px; height: 36px; font-size: 16px; }
            .modal { padding: 16px; width: 95%; }
            .btn-category-header { font-size: 12px; padding: 8px 12px; }
            .table-container { padding: 12px; }
            .btn-approval-stok { font-size: 12px; padding: 6px 12px; }
            .btn-approve, .btn-reject { width: 32px; height: 32px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar batik-bg">
        <div class="logo">
            <img src="assets/logo.svg" alt="Chick Point" onerror="this.style.display='none'">
            <h1>Chick Point</h1>
        </div>
        <nav>
            <a href="index.html"><i class="fas fa-chart-pie"></i><span> Dashboard</span></a>
            <a href="kasir.html"><i class="fas fa-cash-register"></i><span> Kasir</span></a>
            <a href="produk.html" class="active"><i class="fas fa-utensils"></i><span> Produk</span></a>
            <a href="promo.html"><i class="fas fa-tags"></i><span> Promo</span></a>
            <a href="history.html"><i class="fas fa-history"></i><span> History</span></a>
            <a href="laporan.html"><i class="fas fa-file-alt"></i><span> Laporan</span></a>
            <a href="outlet.html"><i class="fas fa-store"></i><span> Outlet & User</span></a>
        </nav>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="userName">Loading...</span>
            <button onclick="logoutUser()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header>
            <div class="header-title">
                <h2>🍗 Manajemen Produk</h2>
                <p id="dateDisplay"></p>
            </div>
            <div class="header-actions">
                <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <select id="outletFilter" class="dropdown-style" onchange="loadProducts()">
                    <option value="all">Semua Outlet</option>
                </select>
                <div class="btn-header-group">
                    <button class="btn-category-header" onclick="openCategoryModal()">
                        <i class="fas fa-tags"></i> Edit Kategori
                    </button>
                    <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Tambah Produk</button>
                </div>
            </div>
        </header>

        <div class="page-header">
            <div class="table-actions">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchProduct" placeholder="Cari produk..." oninput="filterTable()">
                </div>
                <select id="categoryFilter" class="dropdown-style" onchange="filterTable()">
                    <option value="all">Semua Kategori</option>
                </select>
                <!-- Tombol Approval Stok (hanya untuk manajer) -->
                <button id="btnApprovalStok" class="btn-approval-stok" onclick="openApprovalModal()" style="display:none;">
                    <i class="fas fa-check-circle"></i> Approval Stok
                    <span class="badge-count" id="approvalBadge" style="display:none;">0</span>
                </button>
            </div>
            <span id="productCount" style="font-size:13px;color:#888;">Total: 0 produk</span>
        </div>

        <div class="table-container batik-border">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ikon</th>
                        <th>Nama</th>
                        <th>Kategori</th>
                        <th>Harga Jual</th>
                        <th>HPP</th>
                        <th>Margin</th>
                        <th>Stok</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <tr><td colspan="10" style="text-align:center;padding:30px;color:#999;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== MODAL TAMBAH/EDIT PRODUK ===== -->
    <div class="modal-overlay" id="productModal">
        <div class="modal batik-border">
            <h2 id="modalTitle">Tambah Produk</h2>
            <form id="productForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nama Produk *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Kategori *</label>
                        <select id="productCategory" required>
                            <option value="">Pilih Kategori</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Harga Jual (Rp) *</label>
                        <input type="text" id="productPrice" class="format-angka" required placeholder="Contoh: 15000" oninput="formatRupiahInput(this)" onblur="formatRupiahInput(this)">
                    </div>
                    <div class="form-group">
                        <label>HPP (Rp) *</label>
                        <input type="text" id="productHPP" class="format-angka" required placeholder="Contoh: 11700" oninput="formatRupiahInput(this)" onblur="formatRupiahInput(this)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Stok *</label>
                        <input type="text" id="productStock" class="format-angka" required placeholder="Contoh: 40" oninput="formatRupiahInput(this)" onblur="formatRupiahInput(this)">
                    </div>
                    <div class="form-group">
                        <label>Outlet</label>
                        <select id="productOutlet">
                            <option value="all">Semua Outlet</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Bebas Pajak</label>
                        <select id="productTaxExempt">
                            <option value="false">Tidak (Kena Pajak)</option>
                            <option value="true">Ya (Bebas Pajak)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Deskripsi</label>
                        <textarea id="productDescription" rows="2" placeholder="Deskripsi produk..."></textarea>
                    </div>
                </div>
                <div class="form-group" id="marginPreview" style="display:none;">
                    <label>Preview Margin</label>
                    <div id="marginInfo"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('productModal')">Batal</button>
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL KATEGORI ===== -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal batik-border">
            <h2>📁 Manajemen Kategori</h2>
            <div class="form-group">
                <label>Pilih Kategori untuk Diedit</label>
                <select id="categorySelect" onchange="loadCategoryToEdit()">
                    <option value="">-- Pilih Kategori --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Edit Nama Kategori</label>
                <div class="category-edit-row">
                    <input type="text" id="editCategoryName" placeholder="Nama baru..." disabled>
                    <button type="button" class="btn-sm btn-primary-sm" onclick="updateCategory()" style="white-space:nowrap;">
                        <i class="fas fa-pen"></i> Update Kategori
                    </button>
                </div>
            </div>
            <hr style="margin:16px 0;border-color:#e5e7eb;">
            <div class="form-group">
                <label>Daftar Kategori</label>
                <div class="category-list" id="categoryList">
                    <div style="text-align:center;padding:10px;color:#999;">Memuat...</div>
                </div>
            </div>
            <hr style="margin:16px 0;border-color:#e5e7eb;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Tambah Kategori Baru</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="newCategoryName" placeholder="Nama kategori baru..." style="flex:1;padding:10px 14px;border:2px solid #e5e7eb;border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;">
                    <button type="button" class="btn-primary" onclick="addCategory()" style="padding:10px 20px;">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeCategoryModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL APPROVAL STOK ===== -->
    <div class="modal-overlay" id="approvalModal">
        <div class="modal batik-border">
            <h2>⏳ Approval Stok</h2>
            <div class="filter-approval">
                <select id="approvalOutletFilter" onchange="renderApprovalModal()">
                    <option value="all">Semua Outlet</option>
                </select>
                <select id="approvalCategoryFilter" onchange="renderApprovalModal()">
                    <option value="all">Semua Kategori</option>
                </select>
                <button class="btn-refresh-approval" onclick="refreshApprovalData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="approvalList" class="approval-list">
                <div style="text-align:center;padding:20px;color:#999;">Memuat request...</div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('approvalModal')">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAXxnQFVppkpLWfCMBk-pEEJxfqxiLNPxI",
            authDomain: "cloud-chickpoint.firebaseapp.com",
            projectId: "cloud-chickpoint",
            storageBucket: "cloud-chickpoint.firebasestorage.app",
            messagingSenderId: "794896593049",
            appId: "1:794896593049:web:ede71767d065b621dc0808"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allProducts = [];
        let editingId = null;
        let allCategories = [];
        let allOutlets = [];
        let pendingApprovals = [];

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').classList.remove('fa-moon');
            document.getElementById('themeIcon').classList.add('fa-sun');
        }

        // ============================================================
        // ROLE-BASED MENU RESTRICTION
        // ============================================================
        function restrictMenuByRole(role) {
            const links = document.querySelectorAll('.sidebar nav a');
            let allowed = [];
            if (role === 'kasir') {
                allowed = ['kasir.html', 'history.html'];
            } else if (role === 'admin') {
                allowed = ['index.html', 'kasir.html', 'produk.html', 'promo.html', 'history.html', 'laporan.html', 'outlet.html'];
            }
            links.forEach(link => {
                const href = link.getAttribute('href');
                let show = true;
                if (allowed.length > 0) show = allowed.includes(href);
                if (!show) link.classList.add('hidden-role');
                else link.classList.remove('hidden-role');
            });
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function formatRupiahInput(input) {
            let value = input.value.replace(/\D/g, '');
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            input.value = value;
        }

        function formatDate(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ============================================================
        // LOAD CATEGORIES
        // ============================================================
        async function loadCategoriesFromDB() {
            try {
                const snapshot = await db.collection('categories').orderBy('name').get();
                allCategories = [];
                snapshot.forEach(doc => {
                    allCategories.push({ id: doc.id, name: doc.data().name });
                });
                return allCategories;
            } catch (error) {
                console.error('Error loading categories:', error);
                return [];
            }
        }

        // ============================================================
        // CRUD KATEGORI
        // ============================================================
        async function saveCategoryToDB(name) {
            try {
                const docRef = await db.collection('categories').add({
                    name: name.trim(),
                    createdAt: new Date().toISOString()
                });
                return docRef.id;
            } catch (error) {
                console.error('Error saving category:', error);
                throw error;
            }
        }

        async function updateCategoryInDB(id, newName) {
            try {
                await db.collection('categories').doc(id).update({
                    name: newName.trim(),
                    updatedAt: new Date().toISOString()
                });
            } catch (error) {
                console.error('Error updating category:', error);
                throw error;
            }
        }

        async function deleteCategoryFromDB(id) {
            try {
                await db.collection('categories').doc(id).delete();
            } catch (error) {
                console.error('Error deleting category:', error);
                throw error;
            }
        }

        // ============================================================
        // GET ALL CATEGORY NAMES
        // ============================================================
        function getAllCategoryNames() {
            const catNames = new Set();
            allCategories.forEach(c => catNames.add(c.name));
            allProducts.forEach(p => {
                if (p.categoryName) catNames.add(p.categoryName);
            });
            return Array.from(catNames).sort();
        }

        // ============================================================
        // LOAD CATEGORIES UI
        // ============================================================
        function loadCategoriesUI() {
            const categories = getAllCategoryNames();

            const filterSelect = document.getElementById('categoryFilter');
            const filterCurrent = filterSelect.value;
            filterSelect.innerHTML = '<option value="all">Semua Kategori</option>';
            categories.forEach(c => {
                const displayName = c.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                filterSelect.innerHTML += `<option value="${c}">${displayName}</option>`;
            });
            if (filterCurrent && categories.includes(filterCurrent)) {
                filterSelect.value = filterCurrent;
            }

            const productSelect = document.getElementById('productCategory');
            const prodCurrent = productSelect.value;
            productSelect.innerHTML = '<option value="">Pilih Kategori</option>';
            allCategories.forEach(c => {
                const displayName = c.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                productSelect.innerHTML += `<option value="${c.id}">${displayName}</option>`;
            });
            if (prodCurrent && allCategories.some(c => c.id === prodCurrent)) {
                productSelect.value = prodCurrent;
            }

            const editSelect = document.getElementById('categorySelect');
            const editCurrent = editSelect.value;
            editSelect.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            allCategories.forEach(c => {
                const displayName = c.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                editSelect.innerHTML += `<option value="${c.id}">${displayName}</option>`;
            });
            if (editCurrent && allCategories.some(c => c.id === editCurrent)) {
                editSelect.value = editCurrent;
                loadCategoryToEdit();
            }

            renderCategoryList();
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryList');
            if (allCategories.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:10px;color:#999;">Belum ada kategori</div>';
                return;
            }
            container.innerHTML = allCategories.map(c => `
                <div class="category-item">
                    <span class="cat-name">${c.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span>
                    <div class="cat-actions">
                        <button class="cat-edit" onclick="selectCategoryForEdit('${c.id}')" title="Edit"><i class="fas fa-pen"></i></button>
                        <button class="cat-delete" onclick="deleteCategory('${c.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function selectCategoryForEdit(id) {
            document.getElementById('categorySelect').value = id;
            loadCategoryToEdit();
        }

        function loadCategoryToEdit() {
            const id = document.getElementById('categorySelect').value;
            const input = document.getElementById('editCategoryName');
            if (id) {
                const cat = allCategories.find(c => c.id === id);
                if (cat) {
                    input.value = cat.name;
                    input.disabled = false;
                }
            } else {
                input.value = '';
                input.disabled = true;
            }
        }

        // ============================================================
        // ADD / UPDATE / DELETE CATEGORY
        // ============================================================
        async function addCategory() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            if (!name) {
                alert('❌ Nama kategori wajib diisi!');
                return;
            }
            const categories = getAllCategoryNames();
            if (categories.includes(name)) {
                alert('❌ Kategori "' + name + '" sudah ada!');
                return;
            }
            try {
                await saveCategoryToDB(name);
                await loadCategoriesFromDB();
                loadCategoriesUI();
                input.value = '';
                alert('✅ Kategori berhasil ditambahkan!');
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function updateCategory() {
            const id = document.getElementById('categorySelect').value;
            const input = document.getElementById('editCategoryName');
            const newName = input.value.trim();
            if (!id) {
                alert('❌ Silakan pilih kategori yang ingin diedit!');
                return;
            }
            if (!newName) {
                alert('❌ Nama kategori baru wajib diisi!');
                return;
            }
            const oldCategory = allCategories.find(c => c.id === id);
            if (!oldCategory) {
                alert('❌ Kategori tidak ditemukan!');
                return;
            }
            const categories = getAllCategoryNames();
            if (categories.includes(newName) && newName !== oldCategory.name) {
                alert('❌ Kategori "' + newName + '" sudah ada!');
                return;
            }
            if (newName === oldCategory.name) {
                alert('ℹ️ Nama kategori tidak berubah.');
                return;
            }
            if (!confirm(`Yakin ingin mengubah kategori "${oldCategory.name}" menjadi "${newName}"?`)) return;

            try {
                await updateCategoryInDB(id, newName);
                const productsToUpdate = allProducts.filter(p => p.categoryId === id);
                for (const product of productsToUpdate) {
                    await db.collection('products').doc(product.id).update({
                        categoryName: newName,
                        updatedAt: new Date().toISOString()
                    });
                }
                await loadCategoriesFromDB();
                await loadProducts();
                loadCategoriesUI();
                alert(`✅ Kategori berhasil diupdate menjadi "${newName}"! ${productsToUpdate.length > 0 ? productsToUpdate.length + ' produk juga diperbarui.' : ''}`);
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function deleteCategory(id) {
            const cat = allCategories.find(c => c.id === id);
            if (!cat) return;
            const used = allProducts.filter(p => p.categoryId === id);
            let msg = `Yakin ingin menghapus kategori "${cat.name}"?`;
            if (used.length > 0) {
                msg = `⚠️ Kategori "${cat.name}" digunakan oleh ${used.length} produk. Yakin ingin menghapusnya?`;
            }
            if (!confirm(msg)) return;
            try {
                await deleteCategoryFromDB(id);
                await loadCategoriesFromDB();
                loadCategoriesUI();
                alert('✅ Kategori berhasil dihapus!');
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    currentUser = { 
                        uid: user.uid, 
                        email: user.email, 
                        ...userDoc.data() 
                    };
                    document.getElementById('userName').textContent = currentUser.name || 'Admin';
                    restrictMenuByRole(currentUser.role);

                    if (currentUser.role === 'kasir') {
                        alert('⚠️ Anda tidak memiliki akses ke halaman ini!');
                        window.location.href = 'kasir.html';
                        return;
                    }

                    if (currentUser.role === 'manajer') {
                        document.getElementById('btnApprovalStok').style.display = 'inline-flex';
                        // Load pending approvals untuk badge
                        await loadPendingApprovals();
                        updateApprovalBadge();
                    }

                    await loadOutlets();
                    await loadCategoriesFromDB();
                    await loadProducts();
                } else {
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function logoutUser() {
            auth.signOut();
            localStorage.removeItem('selectedOutlet');
            window.location.href = 'login.html';
        }

        // ============================================================
        // LOAD OUTLETS
        // ============================================================
        async function loadOutlets() {
            try {
                const snapshot = await db.collection('outlets').get();
                const select = document.getElementById('outletFilter');
                const modalSelect = document.getElementById('productOutlet');
                select.innerHTML = '<option value="all">Semua Outlet</option>';
                modalSelect.innerHTML = '<option value="all">Semua Outlet</option>';
                allOutlets = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allOutlets.push({ id: doc.id, ...data });
                    const opt = document.createElement('option');
                    opt.value = doc.id;
                    opt.textContent = data.name || 'Outlet ' + doc.id;
                    select.appendChild(opt.cloneNode(true));
                    modalSelect.appendChild(opt);
                });
            } catch (error) {
                console.error('Error loading outlets:', error);
            }
        }

        // ============================================================
        // LOAD PRODUCTS
        // ============================================================
        async function loadProducts() {
            try {
                const outletId = document.getElementById('outletFilter').value;
                let q = db.collection('products').orderBy('name');
                if (outletId && outletId !== 'all') {
                    q = q.where('outletId', 'in', ['all', outletId]);
                }
                const snapshot = await q.get();
                allProducts = [];
                snapshot.forEach(doc => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });
                renderProducts(allProducts);
                document.getElementById('productCount').textContent = `Total: ${allProducts.length} produk`;
                loadCategoriesUI();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // ============================================================
        // RENDER PRODUCTS
        // ============================================================
        function renderProducts(products) {
            const tbody = document.getElementById('productsBody');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:#999;">Tidak ada produk</td></tr>';
                return;
            }

            let html = '';
            products.forEach((p, i) => {
                const margin = (p.price || 0) - (p.hpp || 0);
                const marginPercent = p.price > 0 ? ((margin / p.price) * 100).toFixed(1) : 0;
                const marginClass = margin >= 0 ? 'positive' : 'negative';
                const cat = allCategories.find(c => c.id === p.categoryId);
                const categoryDisplay = cat ? cat.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : (p.categoryName || '-');

                html += `<tr>
                    <td>${i + 1}</td>
                    <td><div class="product-icon"><i class="fas fa-utensils"></i></div></td>
                    <td><strong>${p.name || 'N/A'}</strong></td>
                    <td>${categoryDisplay}</td>
                    <td>Rp ${(p.price || 0).toLocaleString()}</td>
                    <td>Rp ${(p.hpp || 0).toLocaleString()}</td>
                    <td><span class="margin-info ${marginClass}">${margin >= 0 ? '+' : '-'}Rp ${Math.abs(margin).toLocaleString()} (${marginPercent}%)</span></td>
                    <td>${p.stock || 0}</td>
                    <td><span class="status-badge ${p.isActive !== false ? 'active' : 'inactive'}">${p.isActive !== false ? 'Aktif' : 'Nonaktif'}</span></td>
                    <td><div class="btn-action-group">
                        <button class="btn-icon btn-edit" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon btn-toggle" onclick="toggleProduct('${p.id}')"><i class="fas fa-power-off"></i></button>
                        <button class="btn-icon btn-delete" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div></td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // FILTER TABLE
        // ============================================================
        function filterTable() {
            const search = document.getElementById('searchProduct').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            let filtered = allProducts;
            if (search) {
                filtered = filtered.filter(p => p.name && p.name.toLowerCase().includes(search));
            }
            if (category !== 'all') {
                filtered = filtered.filter(p => {
                    const cat = allCategories.find(c => c.id === p.categoryId);
                    return cat ? cat.name === category : false;
                });
            }
            renderProducts(filtered);
        }

        // ============================================================
        // MODAL PRODUK
        // ============================================================
        function openModal(product = null) {
            const modal = document.getElementById('productModal');
            document.getElementById('productForm').reset();
            editingId = null;
            if (product && typeof product === 'object' && product.id) {
                document.getElementById('modalTitle').textContent = 'Edit Produk';
                document.getElementById('productName').value = product.name || '';
                document.getElementById('productCategory').value = product.categoryId || '';
                document.getElementById('productPrice').value = (product.price || 0).toLocaleString('id-ID');
                document.getElementById('productHPP').value = (product.hpp || 0).toLocaleString('id-ID');
                document.getElementById('productStock').value = (product.stock || 0).toLocaleString('id-ID');
                document.getElementById('productOutlet').value = product.outletId || 'all';
                document.getElementById('productTaxExempt').value = product.taxExempt ? 'true' : 'false';
                document.getElementById('productDescription').value = product.description || '';
                editingId = product.id;
            } else {
                document.getElementById('modalTitle').textContent = 'Tambah Produk';
            }
            updateMarginPreview();
            modal.classList.add('active');
        }

        function closeModal(modalId) {
            if (!modalId) modalId = 'productModal';
            const el = document.getElementById(modalId);
            if (el) el.classList.remove('active');
            if (modalId === 'productModal') {
                document.getElementById('productForm').reset();
                editingId = null;
            }
        }

        // ============================================================
        // MODAL KATEGORI
        // ============================================================
        async function openCategoryModal() {
            await loadCategoriesFromDB();
            document.getElementById('categoryModal').classList.add('active');
            document.getElementById('newCategoryName').value = '';
            document.getElementById('editCategoryName').value = '';
            document.getElementById('editCategoryName').disabled = true;
            document.getElementById('categorySelect').value = '';
            loadCategoriesUI();
            renderCategoryList();
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        // ============================================================
        // MARGIN PREVIEW
        // ============================================================
        function updateMarginPreview() {
            const price = parseInt(document.getElementById('productPrice').value.replace(/\D/g, '')) || 0;
            const hpp = parseInt(document.getElementById('productHPP').value.replace(/\D/g, '')) || 0;
            const margin = price - hpp;
            const marginPercent = price > 0 ? ((margin / price) * 100).toFixed(1) : 0;
            const preview = document.getElementById('marginPreview');
            const info = document.getElementById('marginInfo');
            if (price > 0 || hpp > 0) {
                preview.style.display = 'block';
                info.innerHTML = `<span class="margin-info ${margin >= 0 ? 'positive' : 'negative'}">Margin: ${margin >= 0 ? '+' : '-'}Rp ${Math.abs(margin).toLocaleString()} (${marginPercent}%)</span>`;
            } else {
                preview.style.display = 'none';
            }
        }

        document.getElementById('productPrice').addEventListener('input', updateMarginPreview);
        document.getElementById('productHPP').addEventListener('input', updateMarginPreview);

        // ============================================================
        // EDIT / TOGGLE / DELETE PRODUCT
        // ============================================================
        function editProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (product) openModal(product);
        }

        async function toggleProduct(id) {
            try {
                const product = allProducts.find(p => p.id === id);
                if (!product) return;
                await db.collection('products').doc(id).update({
                    isActive: product.isActive === false ? true : false,
                    updatedAt: new Date().toISOString()
                });
                await loadProducts();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Yakin ingin menghapus produk ini?')) return;
            try {
                await db.collection('products').doc(id).delete();
                await loadProducts();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================================
        // SUBMIT PRODUK
        // ============================================================
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const categoryId = document.getElementById('productCategory').value;
            const cat = allCategories.find(c => c.id === categoryId);
            const data = {
                name: document.getElementById('productName').value.trim(),
                categoryId: categoryId,
                categoryName: cat ? cat.name : '',
                price: parseInt(document.getElementById('productPrice').value.replace(/\D/g, '')) || 0,
                hpp: parseInt(document.getElementById('productHPP').value.replace(/\D/g, '')) || 0,
                stock: parseInt(document.getElementById('productStock').value.replace(/\D/g, '')) || 0,
                outletId: document.getElementById('productOutlet').value,
                taxExempt: document.getElementById('productTaxExempt').value === 'true',
                description: document.getElementById('productDescription').value.trim(),
                isActive: true,
                updatedAt: new Date().toISOString()
            };
            if (!data.name || !data.categoryId || data.price <= 0) {
                alert('Mohon isi semua field yang wajib (*)');
                return;
            }
            try {
                if (editingId) {
                    await db.collection('products').doc(editingId).update(data);
                } else {
                    data.createdAt = new Date().toISOString();
                    await db.collection('products').add(data);
                }
                closeModal('productModal');
                await loadProducts();
                alert(editingId ? '✅ Produk berhasil diupdate!' : '✅ Produk berhasil ditambahkan!');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // ============================================================
        // UPDATE APPROVAL BADGE
        // ============================================================
        function updateApprovalBadge() {
            const badge = document.getElementById('approvalBadge');
            const count = pendingApprovals.filter(a => a.status === 'pending').length;
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        }

        // ============================================================
        // APPROVAL STOK (MANAJER) - PERBAIKAN UTAMA
        // ============================================================
        async function loadPendingApprovals() {
            if (currentUser?.role !== 'manajer') {
                pendingApprovals = [];
                return [];
            }
            
            try {
                console.log('📥 Loading pending approvals from Firestore...');
                
                // Query semua dokumen di collection stockApprovals dengan status pending
                const snap = await db.collection('stockApprovals')
                    .where('status', '==', 'pending')
                    .get();
                
                console.log(`📊 Found ${snap.size} pending approvals`);
                
                const approvals = [];
                for (const doc of snap.docs) {
                    const data = doc.data();
                    console.log('📄 Approval data:', { id: doc.id, ...data });
                    
                    // Cari nama user yang request
                    let realUserName = data.requestedByName || 'Admin';
                    
                    if (data.requestedBy && data.requestedBy !== 'unknown') {
                        try {
                            const userDoc = await db.collection('users').doc(data.requestedBy).get();
                            if (userDoc.exists && userDoc.data().name) {
                                realUserName = userDoc.data().name;
                            }
                        } catch (err) {
                            console.error('Error fetching user name:', err);
                        }
                    }
                    
                    approvals.push({ 
                        id: doc.id, 
                        ...data, 
                        realUserName,
                        proposedStock: data.requestedStock || data.proposedStock || 0,
                        currentStock: data.currentStock || 0,
                        requestedAt: data.createdAt || data.requestedAt || new Date().toISOString(),
                        status: data.status || 'pending'
                    });
                }

                pendingApprovals = approvals;
                updateApprovalBadge();
                console.log(`✅ Loaded ${pendingApprovals.length} pending approvals`);
                return pendingApprovals;
            } catch (error) {
                console.error('❌ Error loading approvals:', error);
                pendingApprovals = [];
                return [];
            }
        }

        function populateApprovalFilters() {
            const catFilter = document.getElementById('approvalCategoryFilter');
            if (catFilter) {
                const currentVal = catFilter.value;
                catFilter.innerHTML = '<option value="all">Semua Kategori</option>';
                allCategories.forEach(c => {
                    const displayName = c.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    catFilter.innerHTML += `<option value="${c.id}">${displayName}</option>`;
                });
                if (currentVal && allCategories.some(c => c.id === currentVal)) {
                    catFilter.value = currentVal;
                }
            }

            const outletFilter = document.getElementById('approvalOutletFilter');
            if (outletFilter) {
                const currentVal = outletFilter.value;
                outletFilter.innerHTML = '<option value="all">Semua Outlet</option>';
                allOutlets.forEach(o => {
                    const displayName = o.name || o.id;
                    outletFilter.innerHTML += `<option value="${o.id}">${displayName}</option>`;
                });
                if (currentVal && allOutlets.some(o => o.id === currentVal)) {
                    outletFilter.value = currentVal;
                }
            }
        }

        async function refreshApprovalData() {
            console.log('🔄 Refreshing approval data...');
            await loadPendingApprovals();
            renderApprovalModal();
        }

        async function openApprovalModal() {
            if (currentUser?.role !== 'manajer') {
                alert('⚠️ Hanya Manajer yang bisa melihat approval stok.');
                return;
            }
            
            console.log('🔓 Opening approval modal...');
            
            if (allCategories.length === 0) await loadCategoriesFromDB();
            if (allOutlets.length === 0) await loadOutlets();
            
            populateApprovalFilters();
            await loadPendingApprovals();
            renderApprovalModal();
            document.getElementById('approvalModal').classList.add('active');
        }

        function renderApprovalModal() {
            const container = document.getElementById('approvalList');
            const categoryFilter = document.getElementById('approvalCategoryFilter')?.value || 'all';
            const outletFilter = document.getElementById('approvalOutletFilter')?.value || 'all';

            console.log(`📋 Rendering approvals, total: ${pendingApprovals.length}, category filter: ${categoryFilter}, outlet filter: ${outletFilter}`);

            let filtered = [...pendingApprovals];

            if (categoryFilter !== 'all') {
                filtered = filtered.filter(a => {
                    const product = allProducts.find(p => p.id === a.productId);
                    return product && product.categoryId === categoryFilter;
                });
            }

            if (outletFilter !== 'all') {
                filtered = filtered.filter(a => {
                    const targetOutletId = a.outletId || (allProducts.find(p => p.id === a.productId)?.outletId || 'all');
                    return targetOutletId === outletFilter;
                });
            }

            console.log(`📊 Filtered: ${filtered.length} approvals`);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#999;">
                        Tidak ada request pending
                        ${pendingApprovals.length > 0 ? ` (${pendingApprovals.length} total, tapi filter tidak cocok)` : ''}
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((a, index) => {
                const product = allProducts.find(p => p.id === a.productId);
                const category = product ? allCategories.find(c => c.id === product.categoryId) : null;
                const categoryName = category ? category.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : (product?.categoryName || '-');
                
                let outletName = 'Semua Outlet';
                const targetOutletId = a.outletId || (product ? product.outletId : 'all');
                
                if (a.outletName && a.outletName.toLowerCase() !== 'all' && a.outletName !== 'Semua Outlet') {
                    outletName = a.outletName;
                } else if (targetOutletId && targetOutletId !== 'all') {
                    const ot = allOutlets.find(o => o.id === targetOutletId);
                    outletName = ot ? ot.name : targetOutletId;
                }

                const requestedStock = a.requestedStock || a.proposedStock || 0;
                const currentStock = a.currentStock || 0;

                html += `
                    <div class="approval-item" id="approval-item-${a.id}">
                        <div class="info" id="approval-info-${a.id}">
                            <div class="name">${index + 1}. ${outletName} - ${a.productName} (Stok diajukan : ${requestedStock})</div>
                            <div class="detail">
                                Kategori : ${categoryName}<br>
                                Diajukan oleh : ${a.realUserName}<br>
                                Stok awal : ${currentStock}<br>
                                <small style="color: #999; margin-top: 4px; display: block;">${formatDate(a.requestedAt || a.createdAt)}</small>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-approve" onclick="approveStockRequest('${a.id}', ${requestedStock})" title="Setujui (Approve)">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="btn-reject" onclick="rejectStockRequest('${a.id}')" title="Tolak (Reject)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function approveStockRequest(approvalId, proposedStock) {
            if (!currentUser) {
                alert('❌ Anda belum login. Silakan login kembali.');
                return;
            }
            if (currentUser.role !== 'manajer') {
                alert('❌ Hanya Manajer yang bisa menyetujui request.');
                return;
            }

            const infoEl = document.getElementById(`approval-info-${approvalId}`);
            if (infoEl) {
                infoEl.innerHTML = '<span style="color:#22c55e; font-weight:600;">⏳ Memproses persetujuan...</span>';
            }

            try {
                const doc = await db.collection('stockApprovals').doc(approvalId).get();
                if (!doc.exists) return alert('Request tidak ditemukan');
                const data = doc.data();
                if (data.status !== 'pending') return alert('Request sudah diproses');

                const productRef = db.collection('products').doc(data.productId);
                await productRef.update({ 
                    stock: proposedStock, 
                    updatedAt: new Date().toISOString(),
                    updatedBy: currentUser.uid || 'manajer'
                });
                
                await db.collection('stockApprovals').doc(approvalId).update({
                    status: 'approved',
                    approvedBy: currentUser.uid || auth.currentUser?.uid || 'unknown',
                    approvedByName: currentUser.name || 'Manajer',
                    approvedAt: new Date().toISOString()
                });

                // Refresh data
                await loadProducts();
                await loadPendingApprovals();
                renderApprovalModal();
                updateApprovalBadge();
                alert('✅ Stok berhasil diupdate!');
            } catch (error) {
                alert('❌ Error: ' + error.message);
                console.error('Approve error:', error);
                await loadPendingApprovals();
                renderApprovalModal();
            }
        }

        async function rejectStockRequest(approvalId) {
            if (!currentUser) {
                alert('❌ Anda belum login. Silakan login kembali.');
                return;
            }
            if (currentUser.role !== 'manajer') {
                alert('❌ Hanya Manajer yang bisa menolak request.');
                return;
            }

            const infoEl = document.getElementById(`approval-info-${approvalId}`);
            if (infoEl) {
                infoEl.innerHTML = '<span style="color:#ef4444; font-weight:600;">⏳ Memproses penolakan...</span>';
            }

            try {
                await db.collection('stockApprovals').doc(approvalId).update({
                    status: 'rejected',
                    rejectedBy: currentUser.uid || auth.currentUser?.uid || 'unknown',
                    rejectedByName: currentUser.name || 'Manajer',
                    rejectedAt: new Date().toISOString()
                });

                await loadPendingApprovals();
                renderApprovalModal();
                updateApprovalBadge();
                alert('✅ Request ditolak.');
            } catch (error) {
                alert('❌ Error: ' + error.message);
                console.error('Reject error:', error);
                await loadPendingApprovals();
                renderApprovalModal();
            }
        }

        // ============================================================
        // DATE DISPLAY
        // ============================================================
        document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('id-ID', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    </script>
</body>
</html>
