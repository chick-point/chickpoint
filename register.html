<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chick Point</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/batik-pattern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ===== THEME TOGGLE BUTTON ===== */
        .btn-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--accent);
            color: var(--text-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .btn-theme-toggle:hover {
            background: var(--accent);
            color: white;
            transform: rotate(15deg);
        }
        body.dark-mode .btn-theme-toggle {
            border-color: #C9A84C;
            color: #C9A84C;
            background: #1e1e1e;
        }
        body.dark-mode .btn-theme-toggle:hover {
            background: #C9A84C;
            color: #121212;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201,168,76,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(201,168,76,0.06) 0%, transparent 50%),
                repeating-linear-gradient(30deg, transparent, transparent 8px, rgba(201,168,76,0.02) 8px, rgba(201,168,76,0.02) 9px),
                repeating-linear-gradient(-30deg, transparent, transparent 8px, rgba(201,168,76,0.02) 8px, rgba(201,168,76,0.02) 9px);
            padding: 20px;
            transition: background 0.3s;
        }
        body.dark-mode {
            background: #121212;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(201,168,76,0.08) 0%, transparent 50%),
                repeating-linear-gradient(30deg, transparent, transparent 8px, rgba(201,168,76,0.03) 8px, rgba(201,168,76,0.03) 9px),
                repeating-linear-gradient(-30deg, transparent, transparent 8px, rgba(201,168,76,0.03) 8px, rgba(201,168,76,0.03) 9px);
        }
        .register-container {
            background: white;
            padding: 40px 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 460px;
            border: 2px solid var(--accent);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        body.dark-mode .register-container {
            background: #1e1e1e;
            border-color: #333;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .register-container .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .register-container .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary);
            transition: color 0.3s;
        }
        body.dark-mode .register-container .logo h1 {
            color: #C9A84C;
        }
        .register-container .logo p {
            color: #888;
            font-size: 13px;
        }
        body.dark-mode .register-container .logo p {
            color: #aaa;
        }
        .register-container .form-group {
            margin-bottom: 14px;
        }
        .register-container .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--text-dark);
            transition: color 0.3s;
        }
        body.dark-mode .register-container .form-group label {
            color: #ddd;
        }
        .register-container .form-group label .required {
            color: #dc2626;
        }
        .register-container .form-group input,
        .register-container .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
            background: white;
            color: var(--text-dark);
        }
        body.dark-mode .register-container .form-group input,
        body.dark-mode .register-container .form-group select {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .register-container .form-group input:focus,
        .register-container .form-group select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        body.dark-mode .register-container .form-group input:focus,
        body.dark-mode .register-container .form-group select:focus {
            border-color: #C9A84C;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        .register-container .form-group .password-wrapper {
            position: relative;
        }
        .register-container .form-group .password-wrapper input {
            padding-right: 44px;
        }
        .register-container .form-group .password-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 4px 8px;
            transition: 0.2s;
            border-radius: 6px;
        }
        body.dark-mode .register-container .form-group .password-wrapper .toggle-password {
            color: #aaa;
        }
        .register-container .form-group .password-wrapper .toggle-password:hover {
            color: var(--primary);
            background: var(--secondary);
        }
        body.dark-mode .register-container .form-group .password-wrapper .toggle-password:hover {
            color: #C9A84C;
            background: #2a2a2a;
        }
        .register-container .form-group .help-text {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        body.dark-mode .register-container .form-group .help-text {
            color: #999;
        }
        .register-container .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            margin-top: 4px;
        }
        body.dark-mode .btn-register {
            background: #C9A84C;
            color: #121212;
        }
        .register-container .btn-register:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,26,26,0.3);
        }
        body.dark-mode .btn-register:hover {
            background: #b8962a;
            box-shadow: 0 8px 24px rgba(201,168,76,0.3);
        }
        .register-container .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .register-container .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin: 10px 0;
            display: none;
        }
        .register-container .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }
        body.dark-mode .register-container .message.error {
            background: #3a1a1a;
            border-color: #5a2a2a;
            color: #f87171;
        }
        .register-container .message.success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }
        body.dark-mode .register-container .message.success {
            background: #1a3a2a;
            border-color: #2a5a3a;
            color: #4ade80;
        }
        .register-container .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }
        body.dark-mode .register-container .login-link {
            color: #aaa;
        }
        .register-container .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        body.dark-mode .register-container .login-link a {
            color: #C9A84C;
        }
        .register-container .login-link a:hover {
            text-decoration: underline;
        }
        .ornament-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 18px;
        }
        .ornament-line::before,
        .ornament-line::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
        }
        body.dark-mode .ornament-line::before,
        body.dark-mode .ornament-line::after {
            background: linear-gradient(to right, transparent, #C9A84C, transparent);
        }
        .ornament-line .ornament {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        body.dark-mode .ornament-line .ornament {
            background: #C9A84C;
        }
        .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 4px;
            background: #e5e7eb;
            overflow: hidden;
        }
        body.dark-mode .password-strength {
            background: #333;
        }
        .password-strength .bar {
            height: 100%;
            border-radius: 4px;
            transition: 0.3s;
            width: 0%;
        }
        .password-strength .bar.weak { width: 33%; background: #dc2626; }
        .password-strength .bar.medium { width: 66%; background: #f59e0b; }
        .password-strength .bar.strong { width: 100%; background: #22c55e; }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .register-container {
                padding: 24px 16px;
            }
            .btn-theme-toggle {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- TOMBOL THEME TOGGLE -->
    <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="register-container batik-border">
        <div class="logo">
            <h1>🏮 Chick Point</h1>
            <p>Buat Akun Baru</p>
        </div>

        <div class="ornament-line">
            <span class="ornament"></span>
            <span style="font-size:12px;color:#888;">Register</span>
            <span class="ornament"></span>
        </div>

        <form id="registerForm" autocomplete="off">
            <!-- Nama -->
            <div class="form-group">
                <label>👤 Nama Lengkap <span class="required">*</span></label>
                <input type="text" id="regName" placeholder="Nama lengkap" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>📧 Email <span class="required">*</span></label>
                <input type="email" id="regEmail" placeholder="masukkan@email.com" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>🔒 Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="bar" id="passwordBar"></div>
                </div>
                <div class="help-text">Minimal 6 karakter</div>
            </div>

            <!-- Konfirmasi Password -->
            <div class="form-group">
                <label>🔒 Konfirmasi Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="Ketik ulang password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('regConfirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Role -->
            <div class="form-group">
                <label>🔑 Role <span class="required">*</span></label>
                <select id="regRole" required>
                    <option value="">Pilih Role</option>
                    <option value="kasir">Kasir</option>
                    <option value="manajer">Manajer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <!-- Outlet -->
            <div class="form-group">
                <label>🏪 Outlet</label>
                <select id="regOutlet">
                    <option value="">Pilih Outlet (opsional)</option>
                </select>
            </div>

            <!-- Message -->
            <div id="message" class="message"></div>

            <!-- Button -->
            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fas fa-user-plus"></i> Daftar
            </button>
        </form>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login Sekarang</a>
        </div>
    </div>

    <!-- ===== FIREBASE CDN ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAXxnQFVppkpLWfCMBk-pEEJxfqxiLNPxI",
            authDomain: "cloud-chickpoint.firebaseapp.com",
            projectId: "cloud-chickpoint",
            storageBucket: "cloud-chickpoint.firebasestorage.app",
            messagingSenderId: "794896593049",
            appId: "1:794896593049:web:ede71767d065b621dc0808"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load theme on page load
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').classList.remove('fa-moon');
            document.getElementById('themeIcon').classList.add('fa-sun');
        }

        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============================================================
        // LOAD OUTLETS (DARI FIRESTORE ATAU FALLBACK)
        // ============================================================
        async function loadOutlets() {
            const select = document.getElementById('regOutlet');
            
            try {
                const snapshot = await db.collection('outlets').get();
                
                if (snapshot.empty) {
                    console.log('⚠️ Collection outlets kosong, pakai fallback...');
                    // Fallback: option yang sudah ada di HTML
                    return;
                }
                
                // Clear option "Pilih Outlet"
                select.innerHTML = '<option value="">Pilih Outlet (opsional)</option>';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = doc.id;
                    opt.textContent = data.name || 'Outlet ' + doc.id;
                    select.appendChild(opt);
                });
                
                console.log('✅ Outlets loaded:', snapshot.size);
                
            } catch (error) {
                console.error('❌ Error loading outlets:', error);
                // Fallback: pakai option yang sudah ada di HTML
                alert('⚠️ Gagal memuat outlet dari server. Menggunakan daftar outlet lokal.');
            }
        }

        // Panggil saat halaman dimuat
        loadOutlets();

        // ============================================================
        // PASSWORD STRENGTH
        // ============================================================
        document.getElementById('regPassword').addEventListener('input', function() {
            const password = this.value;
            const bar = document.getElementById('passwordBar');
            if (password.length === 0) {
                bar.className = 'bar';
                return;
            }
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            if (strength <= 2) bar.className = 'bar weak';
            else if (strength <= 3) bar.className = 'bar medium';
            else bar.className = 'bar strong';
        });

        // ============================================================
        // REGISTER FORM (MENUNGGU PERSETUJUAN)
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const role = document.getElementById('regRole').value;
            const outletId = document.getElementById('regOutlet').value;
            const message = document.getElementById('message');
            const registerBtn = document.getElementById('registerBtn');
            
            message.className = 'message';
            message.textContent = '';
            
            if (!name) {
                message.className = 'message error';
                message.textContent = '❌ Mohon isi nama lengkap';
                return;
            }
            if (!email || !email.includes('@') || !email.includes('.')) {
                message.className = 'message error';
                message.textContent = '❌ Format email tidak valid';
                return;
            }
            if (password.length < 6) {
                message.className = 'message error';
                message.textContent = '❌ Password minimal 6 karakter';
                return;
            }
            if (password !== confirmPassword) {
                message.className = 'message error';
                message.textContent = '❌ Password dan konfirmasi tidak cocok';
                return;
            }
            if (!role) {
                message.className = 'message error';
                message.textContent = '❌ Mohon pilih role';
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span> Memproses...';
            
            try {
                // Buat akun di Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Simpan data user ke Firestore dengan status PENDING
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    role: role,
                    outletId: outletId || null,
                    outletName: outletId ? document.getElementById('regOutlet').selectedOptions[0].textContent : null,
                    isActive: false,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                
                // Logout otomatis agar user tidak langsung masuk
                await auth.signOut();
                
                message.className = 'message success';
                message.textContent = '✅ Akun berhasil dibuat! Menunggu persetujuan manajemen. Silakan login setelah disetujui.';
                
                // Reset form
                document.getElementById('registerForm').reset();
                document.getElementById('passwordBar').className = 'bar';
                
                // Redirect ke login setelah 3 detik
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
                
            } catch (error) {
                console.error('❌ Register error:', error.code);
                if (error.code === 'auth/email-already-in-use') {
                    message.textContent = '❌ Email sudah terdaftar';
                } else if (error.code === 'auth/weak-password') {
                    message.textContent = '❌ Password terlalu lemah';
                } else if (error.code === 'auth/invalid-email') {
                    message.textContent = '❌ Format email tidak valid';
                } else if (error.code === 'auth/network-request-failed') {
                    message.textContent = '❌ Koneksi internet bermasalah';
                } else {
                    message.textContent = '❌ Error: ' + error.message;
                }
                message.className = 'message error';
                
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar';
            }
        });

        // Validasi real-time konfirmasi password
        document.getElementById('regConfirmPassword').addEventListener('input', function() {
            const password = document.getElementById('regPassword').value;
            if (this.value.length > 0 && password !== this.value) {
                this.style.borderColor = '#dc2626';
            } else {
                this.style.borderColor = '#e5e7eb';
            }
        });

        console.log('✅ Register page loaded successfully!');
    </script>
</body>
</html>
