<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chick Point - Manajemen Promo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/batik-pattern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        .hidden-role { display: none !important; }
        .btn-theme-toggle {
            background: none;
            border: 2px solid var(--accent);
            color: var(--text-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-theme-toggle:hover {
            background: var(--accent);
            color: white;
            transform: rotate(15deg);
        }
        body.dark-mode .btn-theme-toggle {
            border-color: #C9A84C;
            color: #C9A84C;
        }
        body.dark-mode .btn-theme-toggle:hover {
            background: #C9A84C;
            color: #121212;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .promo-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: var(--transition);
            position: relative;
        }
        body.dark-mode .promo-card {
            background: #1e1e1e;
            border-color: #333;
        }
        .promo-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }
        .promo-card .promo-code {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            background: var(--secondary);
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        body.dark-mode .promo-card .promo-code {
            background: #2a2a2a;
            color: #C9A84C;
        }
        .promo-card .promo-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }
        .promo-card .promo-desc {
            color: #666;
            font-size: 13px;
            margin: 8px 0;
        }
        body.dark-mode .promo-card .promo-desc {
            color: #aaa;
        }
        .promo-card .promo-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        body.dark-mode .promo-card .promo-meta {
            color: #999;
        }
        .promo-card .promo-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }
        body.dark-mode .promo-card .promo-actions {
            border-top-color: #333;
        }
        .promo-card .promo-status {
            position: absolute;
            top: 12px;
            right: 12px;
        }
        .promo-card .used-count {
            font-size: 12px;
            color: #666;
        }
        body.dark-mode .promo-card .used-count {
            color: #999;
        }
        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.active { background: #dcfce7; color: #16a34a; }
        .status-badge.inactive { background: #fee2e2; color: #dc2626; }
        .status-badge.pending { background: #fef3c7; color: #d97706; }
        .status-badge.rejected { background: #fee2e2; color: #dc2626; }
        body.dark-mode .status-badge.active { background: #1a3a2a; color: #4ade80; }
        body.dark-mode .status-badge.inactive { background: #3a1a1a; color: #f87171; }
        body.dark-mode .status-badge.pending { background: #3a3a1a; color: #fbbf24; }
        body.dark-mode .status-badge.rejected { background: #3a1a1a; color: #f87171; }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sm:hover { transform: scale(1.05); }
        .btn-edit { background: var(--accent); color: white; }
        body.dark-mode .btn-edit { background: #C9A84C; color: #121212; }
        .btn-delete { background: #dc2626; color: white; }
        .btn-approve { background: #22c55e; color: white; }
        .btn-reject { background: #ef4444; color: white; }

        .modal { max-width: 600px; position: relative; }
        body.dark-mode .modal { background: #1e1e1e; border-color: #333; }
        body.dark-mode .modal h2 { color: #C9A84C; }
        body.dark-mode .modal .form-group label { color: #ddd; }
        body.dark-mode .modal .form-group input,
        body.dark-mode .modal .form-group select {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        body.dark-mode .modal .form-group input:focus,
        body.dark-mode .modal .form-group select:focus {
            border-color: #C9A84C;
        }
        .modal .btn-close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 8px;
            line-height: 1;
        }
        .modal .btn-close-modal:hover {
            background: #f0f0f0;
            color: #333;
        }
        body.dark-mode .modal .btn-close-modal:hover {
            background: #2a2a2a;
            color: #eee;
        }

        .promo-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-tabs button {
            padding: 6px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }
        body.dark-mode .filter-tabs button {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .filter-tabs button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        body.dark-mode .filter-tabs button.active {
            background: #C9A84C;
            color: #121212;
            border-color: #C9A84C;
        }
        .filter-tabs button:hover {
            border-color: var(--accent);
        }

        .currency-input input {
            text-align: right;
            font-feature-settings: "tnum";
        }

        @media (max-width: 768px) {
            .promo-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .promo-form .form-row { grid-template-columns: 1fr; }
            .header-actions { flex-wrap: wrap; }
            .promo-card { padding: 16px; }
            .promo-card .promo-code { font-size: 16px; }
            .promo-card .promo-value { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            .promo-grid { grid-template-columns: 1fr; gap: 12px; }
            .promo-card { padding: 14px; }
            .btn-theme-toggle { width: 36px; height: 36px; font-size: 16px; }
            .modal { padding: 16px; width: 95%; }
            .filter-tabs button { font-size: 11px; padding: 4px 12px; }
            .modal .btn-close-modal { top: 10px; right: 10px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar batik-bg">
        <div class="logo">
            <img src="assets/logo.svg" alt="Chick Point" onerror="this.style.display='none'">
            <h1>Chick Point</h1>
        </div>
        <nav>
            <a href="index.html"><i class="fas fa-chart-pie"></i><span> Dashboard</span></a>
            <a href="kasir.html"><i class="fas fa-cash-register"></i><span> Kasir</span></a>
            <a href="produk.html"><i class="fas fa-utensils"></i><span> Produk</span></a>
            <a href="promo.html" class="active"><i class="fas fa-tags"></i><span> Promo</span></a>
            <a href="history.html"><i class="fas fa-history"></i><span> History</span></a>
            <a href="laporan.html"><i class="fas fa-file-alt"></i><span> Laporan</span></a>
            <a href="outlet.html"><i class="fas fa-store"></i><span> Outlet & User</span></a>
        </nav>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="userName">Loading...</span>
            <button onclick="logoutUser()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="main-content">
        <header>
            <div class="header-title">
                <h2>🏷️ Manajemen Promo</h2>
                <p id="dateDisplay"></p>
            </div>
            <div class="header-actions">
                <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button id="btnAddPromo" class="btn-primary" onclick="openModal()" style="display:none;">
                    <i class="fas fa-plus"></i> <span id="btnAddPromoText">Ajukan Promo</span>
                </button>
            </div>
        </header>

        <div class="filter-tabs">
            <button class="active" data-filter="all" onclick="filterPromos('all')">Semua</button>
            <button data-filter="active" onclick="filterPromos('active')">Aktif</button>
            <button data-filter="pending" onclick="filterPromos('pending')">Menunggu Approval</button>
        </div>

        <div class="promo-grid" id="promoGrid">
            <div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">
                <i class="fas fa-spinner fa-spin" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                Memuat data...
            </div>
        </div>
    </div>

    <!-- ====== MODAL PROMO ====== -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal batik-border">
            <button class="btn-close-modal" onclick="closeModal()" title="Tutup">
                <i class="fas fa-times"></i>
            </button>
            <h2 id="modalTitle">Ajukan Promo</h2>
            <form class="promo-form" id="promoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Kode Promo *</label>
                        <input type="text" id="promoCode" required placeholder="CHICK10" style="text-transform:uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Tipe Promo *</label>
                        <select id="promoType" required>
                            <option value="percentage">Persentase (%)</option>
                            <option value="nominal">Nominal (Rp)</option>
                            <option value="buy_x_get_y">Beli X Gratis Y</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group currency-input">
                        <label>Nilai *</label>
                        <input type="text" id="promoValue" required placeholder="10 atau 10000" oninput="formatCurrency(this)">
                    </div>
                    <div class="form-group currency-input">
                        <label>Maksimal Diskon (opsional)</label>
                        <input type="text" id="promoMaxDiscount" placeholder="50000" oninput="formatCurrency(this)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group currency-input">
                        <label>Minimal Pembelian</label>
                        <input type="text" id="promoMinPurchase" placeholder="50000" oninput="formatCurrency(this)">
                    </div>
                    <div class="form-group">
                        <label>Batas Penggunaan</label>
                        <input type="number" id="promoUsageLimit" min="0" placeholder="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tanggal Mulai *</label>
                        <input type="date" id="promoStartDate" required>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Berakhir *</label>
                        <input type="date" id="promoEndDate" required>
                    </div>
                </div>
                <div class="form-group" id="buyXGroup" style="display:none;">
                    <label>Beli X Gratis Y (untuk tipe Buy X Get Y)</label>
                    <div class="form-row">
                        <input type="number" id="promoBuyX" placeholder="Beli X" min="1" value="1">
                        <input type="number" id="promoGetY" placeholder="Gratis Y" min="1" value="1">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Batalkan</button>
                    <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> <span id="submitBtnText">Ajukan</span></button>
                </div>
            </form>
        </div>
    </div>

    <!-- ====== MODAL REJECT REASON ====== -->
    <div class="modal-overlay" id="rejectModal">
        <div class="modal batik-border">
            <button class="btn-close-modal" onclick="closeRejectModal()" title="Tutup">
                <i class="fas fa-times"></i>
            </button>
            <h2>Tolak Promo</h2>
            <div class="form-group">
                <label>Alasan Penolakan</label>
                <textarea id="rejectReason" rows="3" placeholder="Tulis alasan penolakan..." style="width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:10px;font-family:'Poppins',sans-serif;"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeRejectModal()">Batal</button>
                <button class="btn-danger" onclick="confirmReject()">Tolak</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAXxnQFVppkpLWfCMBk-pEEJxfqxiLNPxI",
            authDomain: "cloud-chickpoint.firebaseapp.com",
            projectId: "cloud-chickpoint",
            storageBucket: "cloud-chickpoint.firebasestorage.app",
            messagingSenderId: "794896593049",
            appId: "1:794896593049:web:ede71767d065b621dc0808"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let allPromos = [];
        let editingId = null;
        let currentFilter = 'all';
        let pendingRejectId = null;

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').classList.remove('fa-moon');
            document.getElementById('themeIcon').classList.add('fa-sun');
        }

        // ============================================================
        // ROLE-BASED MENU & UI
        // ============================================================
        function restrictMenuByRole(role) {
            const links = document.querySelectorAll('.sidebar nav a');
            let allowed = [];
            if (role === 'kasir') {
                allowed = ['kasir.html', 'history.html'];
            } else if (role === 'admin') {
                allowed = ['index.html', 'kasir.html', 'promo.html', 'history.html'];
            }
            links.forEach(link => {
                const href = link.getAttribute('href');
                let show = true;
                if (allowed.length > 0) {
                    show = allowed.includes(href);
                }
                if (!show) {
                    link.classList.add('hidden-role');
                } else {
                    link.classList.remove('hidden-role');
                }
            });
        }

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUser = { uid: user.uid, ...userDoc.data() };
                        document.getElementById('userName').textContent = currentUser.name || 'Admin';

                        restrictMenuByRole(currentUser.role);

                        // Kasir tidak boleh akses
                        if (currentUser.role === 'kasir') {
                            alert('⚠️ Kasir tidak memiliki akses ke halaman ini!');
                            window.location.href = 'kasir.html';
                            return;
                        }

                        const isAdmin = currentUser.role === 'admin';
                        const isManager = currentUser.role === 'manajer';

                        // Tampilkan tombol tambah untuk Admin dan Manajer
                        const btnAdd = document.getElementById('btnAddPromo');
                        btnAdd.style.display = 'inline-flex';

                        if (isAdmin) {
                            document.getElementById('btnAddPromoText').textContent = 'Ajukan Promo';
                            document.getElementById('submitBtnText').textContent = 'Ajukan';
                            document.getElementById('modalTitle').textContent = 'Ajukan Promo';
                        } else if (isManager) {
                            document.getElementById('btnAddPromoText').textContent = 'Tambah Promo';
                            document.getElementById('submitBtnText').textContent = 'Simpan';
                            document.getElementById('modalTitle').textContent = 'Tambah Promo';
                        } else {
                            btnAdd.style.display = 'none';
                        }

                        await loadPromos();
                    } else {
                        window.location.href = 'login.html';
                    }
                } catch (error) {
                    console.error('Error loading user:', error);
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function logoutUser() {
            auth.signOut();
            localStorage.removeItem('selectedOutlet');
            window.location.href = 'login.html';
        }

        // ============================================================
        // LOAD PROMOS
        // ============================================================
        async function loadPromos() {
            try {
                const snapshot = await db.collection('promos').orderBy('createdAt', 'desc').get();
                allPromos = [];
                snapshot.forEach(doc => {
                    allPromos.push({ id: doc.id, ...doc.data() });
                });
                filterPromos(currentFilter);
            } catch (error) {
                console.error('Error loading promos:', error);
            }
        }

        // ============================================================
        // FILTER PROMOS
        // ============================================================
        function filterPromos(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });

            let filtered = [...allPromos];
            const now = new Date().toISOString();

            if (filter === 'active') {
                filtered = filtered.filter(p => p.isActive && p.startDate <= now && p.endDate >= now);
            } else if (filter === 'pending') {
                filtered = filtered.filter(p => p.approvalStatus === 'pending');
            }
            renderPromos(filtered);
        }

        // ============================================================
        // RENDER PROMOS
        // ============================================================
        function renderPromos(promos) {
            const grid = document.getElementById('promoGrid');
            if (promos.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">Tidak ada promo</div>';
                return;
            }

            const isAdmin = currentUser?.role === 'admin';
            const isManager = currentUser?.role === 'manajer';
            const now = new Date().toISOString();

            grid.innerHTML = promos.map(p => {
                const isActive = p.isActive && p.startDate <= now && p.endDate >= now;
                const status = p.approvalStatus || 'approved';
                let statusLabel = '';
                let statusClass = '';
                if (status === 'pending') {
                    statusLabel = 'Menunggu Approval';
                    statusClass = 'pending';
                } else if (status === 'rejected') {
                    statusLabel = 'Ditolak';
                    statusClass = 'rejected';
                } else {
                    statusLabel = isActive ? 'Aktif' : 'Nonaktif';
                    statusClass = isActive ? 'active' : 'inactive';
                }

                const typeLabels = {
                    percentage: 'Persentase',
                    nominal: 'Nominal',
                    buy_x_get_y: 'Beli X Gratis Y'
                };
                const valueDisplay = p.type === 'percentage' ? `${p.value}%` : `Rp ${formatNumberWithDot(p.value || 0)}`;

                let actionsHtml = '';
                if (isManager) {
                    if (status === 'pending') {
                        actionsHtml = `
                            <button class="btn-sm btn-approve" onclick="approvePromo('${p.id}')"><i class="fas fa-check"></i> Setujui</button>
                            <button class="btn-sm btn-reject" onclick="openRejectModal('${p.id}')"><i class="fas fa-times"></i> Tolak</button>
                        `;
                    } else {
                        actionsHtml = `
                            <button class="btn-sm btn-edit" onclick="editPromo('${p.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-sm ${isActive ? 'btn-toggle' : 'btn-toggle'}" onclick="togglePromo('${p.id}')">
                                <i class="fas ${isActive ? 'fa-check' : 'fa-times'}"></i> ${isActive ? 'Nonaktifkan' : 'Aktifkan'}
                            </button>
                            <button class="btn-sm btn-delete" onclick="deletePromo('${p.id}')"><i class="fas fa-trash"></i></button>
                        `;
                    }
                } else if (isAdmin) {
                    if (status === 'pending') {
                        actionsHtml = `<span style="font-size:12px;color:#d97706;">⏳ Menunggu approval manajer</span>`;
                    } else if (status === 'rejected') {
                        actionsHtml = `<span style="font-size:12px;color:#dc2626;">❌ Ditolak</span>`;
                    } else {
                        actionsHtml = `<span style="font-size:12px;color:#888;">Hanya manajer yang bisa mengelola</span>`;
                    }
                }

                return `
                <div class="promo-card">
                    <div class="promo-status">
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="promo-code">${p.code || 'N/A'}</div>
                    <div class="promo-value">${valueDisplay}</div>
                    <div class="promo-desc">${typeLabels[p.type] || p.type}</div>
                    ${p.minPurchase ? `<div class="promo-desc">Min. Belanja: Rp ${formatNumberWithDot(p.minPurchase)}</div>` : ''}
                    <div class="promo-meta">
                        <span>📅 ${formatDate(p.startDate)} - ${formatDate(p.endDate)}</span>
                        <span class="used-count">Digunakan: ${p.usedCount || 0}${p.usageLimit ? `/${p.usageLimit}` : ''}</span>
                    </div>
                    ${p.requestedBy ? `<div class="promo-meta">📨 Diajukan oleh: ${p.requestedByName || p.requestedBy}</div>` : ''}
                    ${p.rejectedReason ? `<div class="promo-meta" style="color:#dc2626;">Alasan ditolak: ${p.rejectedReason}</div>` : ''}
                    <div class="promo-actions">
                        ${actionsHtml}
                    </div>
                </div>
            `}).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // ============================================================
        // FORMAT ANGKA DENGAN TITIK
        // ============================================================
        function formatNumberWithDot(value) {
            if (value === undefined || value === null) return '0';
            return Number(value).toLocaleString('id-ID');
        }

        function formatCurrency(input) {
            let value = input.value.replace(/\D/g, '');
            if (value === '') {
                input.value = '';
                return;
            }
            const num = parseInt(value, 10);
            if (!isNaN(num)) {
                input.value = num.toLocaleString('id-ID');
            }
        }

        function parseCurrencyValue(str) {
            if (!str) return 0;
            return parseInt(str.replace(/\./g, '').replace(/\D/g, ''), 10) || 0;
        }

        // ============================================================
        // OPEN / CLOSE MODAL
        // ============================================================
        function openModal(promo = null) {
            const isAdmin = currentUser?.role === 'admin';
            const isManager = currentUser?.role === 'manajer';

            if (promo && isAdmin) {
                alert('⚠️ Admin tidak bisa mengedit promo. Hanya manajer.');
                return;
            }

            const modal = document.getElementById('promoModal');
            const form = document.getElementById('promoForm');
            form.reset();
            editingId = null;
            const today = new Date().toISOString().split('T')[0];
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            document.getElementById('promoStartDate').value = today;
            document.getElementById('promoEndDate').value = nextMonth.toISOString().split('T')[0];

            document.querySelectorAll('.currency-input input').forEach(inp => inp.value = '');

            if (promo) {
                document.getElementById('modalTitle').textContent = 'Edit Promo';
                document.getElementById('promoCode').value = promo.code || '';
                document.getElementById('promoType').value = promo.type || 'percentage';
                document.getElementById('promoValue').value = promo.value ? formatNumberWithDot(promo.value) : '';
                document.getElementById('promoMaxDiscount').value = promo.maxDiscount ? formatNumberWithDot(promo.maxDiscount) : '';
                document.getElementById('promoMinPurchase').value = promo.minPurchase ? formatNumberWithDot(promo.minPurchase) : '';
                document.getElementById('promoUsageLimit').value = promo.usageLimit || '';
                document.getElementById('promoStartDate').value = promo.startDate ? promo.startDate.split('T')[0] : today;
                document.getElementById('promoEndDate').value = promo.endDate ? promo.endDate.split('T')[0] : nextMonth.toISOString().split('T')[0];
                document.getElementById('promoBuyX').value = promo.buyX || 1;
                document.getElementById('promoGetY').value = promo.getY || 1;
                editingId = promo.id;
                document.getElementById('submitBtnText').textContent = 'Update';
                toggleBuyXGroup();
            } else {
                if (isAdmin) {
                    document.getElementById('modalTitle').textContent = 'Ajukan Promo';
                    document.getElementById('submitBtnText').textContent = 'Ajukan';
                } else if (isManager) {
                    document.getElementById('modalTitle').textContent = 'Tambah Promo';
                    document.getElementById('submitBtnText').textContent = 'Simpan';
                }
                toggleBuyXGroup();
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('promoModal').classList.remove('active');
            document.getElementById('promoForm').reset();
            document.querySelectorAll('.currency-input input').forEach(inp => inp.value = '');
            editingId = null;
        }

        document.getElementById('promoType').addEventListener('change', toggleBuyXGroup);
        function toggleBuyXGroup() {
            const type = document.getElementById('promoType').value;
            document.getElementById('buyXGroup').style.display = type === 'buy_x_get_y' ? 'block' : 'none';
        }

        function editPromo(id) {
            const promo = allPromos.find(p => p.id === id);
            if (promo) openModal(promo);
        }

        // ============================================================
        // SUBMIT PROMO (FIX: requestedBy undefined)
        // ============================================================
        document.getElementById('promoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const isAdmin = currentUser?.role === 'admin';
            const isManager = currentUser?.role === 'manajer';

            // Ambil user yang sedang login
            const user = auth.currentUser;
            if (!user) {
                alert('Anda harus login!');
                return;
            }
            const uid = user.uid;
            const displayName = currentUser?.name || user.displayName || 'Admin';

            const valueRaw = document.getElementById('promoValue').value;
            const maxDiscountRaw = document.getElementById('promoMaxDiscount').value;
            const minPurchaseRaw = document.getElementById('promoMinPurchase').value;

            const data = {
                code: document.getElementById('promoCode').value.toUpperCase().trim(),
                type: document.getElementById('promoType').value,
                value: parseCurrencyValue(valueRaw),
                maxDiscount: parseCurrencyValue(maxDiscountRaw) || null,
                minPurchase: parseCurrencyValue(minPurchaseRaw) || null,
                usageLimit: parseInt(document.getElementById('promoUsageLimit').value) || null,
                startDate: document.getElementById('promoStartDate').value + 'T00:00:00.000Z',
                endDate: document.getElementById('promoEndDate').value + 'T23:59:59.999Z',
                buyX: parseInt(document.getElementById('promoBuyX').value) || 1,
                getY: parseInt(document.getElementById('promoGetY').value) || 1,
                updatedAt: new Date().toISOString()
            };

            if (!data.code || !data.value || data.value <= 0) {
                alert('Mohon isi kode promo dan nilai promo!');
                return;
            }
            if (data.startDate >= data.endDate) {
                alert('Tanggal mulai harus sebelum tanggal berakhir!');
                return;
            }

            try {
                if (editingId) {
                    if (!isManager) {
                        alert('⚠️ Hanya manajer yang bisa mengedit promo.');
                        return;
                    }
                    await db.collection('promos').doc(editingId).update(data);
                    alert('✅ Promo berhasil diupdate!');
                } else {
                    if (isAdmin) {
                        // Admin: ajukan dengan status pending
                        data.isActive = false;
                        data.approvalStatus = 'pending';
                        data.requestedBy = uid; // PASTIKAN TIDAK UNDEFINED
                        data.requestedByName = displayName;
                        data.requestedAt = new Date().toISOString();
                        data.createdAt = new Date().toISOString();
                        data.usedCount = 0;
                        await db.collection('promos').add(data);
                        alert('✅ Promo berhasil diajukan! Menunggu approval manajer.');
                    } else if (isManager) {
                        // Manajer: langsung aktif
                        data.isActive = true;
                        data.approvalStatus = 'approved';
                        data.createdAt = new Date().toISOString();
                        data.usedCount = 0;
                        await db.collection('promos').add(data);
                        alert('✅ Promo berhasil ditambahkan!');
                    } else {
                        alert('⚠️ Anda tidak memiliki izin untuk menambah promo.');
                        return;
                    }
                }
                closeModal();
                await loadPromos();
            } catch (error) {
                alert('Error: ' + error.message);
                console.error('Submit error:', error);
            }
        });

        // ============================================================
        // APPROVE / REJECT (hanya manajer)
        // ============================================================
        async function approvePromo(id) {
            if (currentUser?.role !== 'manajer') {
                alert('⚠️ Hanya manajer yang bisa menyetujui promo.');
                return;
            }
            if (!confirm('Setujui promo ini?')) return;
            try {
                await db.collection('promos').doc(id).update({
                    approvalStatus: 'approved',
                    isActive: true,
                    approvedBy: currentUser.uid,
                    approvedAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                alert('✅ Promo disetujui!');
                await loadPromos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function openRejectModal(id) {
            pendingRejectId = id;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').classList.add('active');
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').classList.remove('active');
            pendingRejectId = null;
        }

        async function confirmReject() {
            if (currentUser?.role !== 'manajer') {
                alert('⚠️ Hanya manajer yang bisa menolak promo.');
                return;
            }
            const reason = document.getElementById('rejectReason').value.trim() || 'Tidak ada alasan';
            if (!pendingRejectId) return;
            try {
                await db.collection('promos').doc(pendingRejectId).update({
                    approvalStatus: 'rejected',
                    isActive: false,
                    rejectedBy: currentUser.uid,
                    rejectedAt: new Date().toISOString(),
                    rejectedReason: reason,
                    updatedAt: new Date().toISOString()
                });
                alert('❌ Promo ditolak.');
                closeRejectModal();
                await loadPromos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================================
        // TOGGLE / DELETE (hanya manajer)
        // ============================================================
        async function togglePromo(id) {
            if (currentUser?.role !== 'manajer') {
                alert('⚠️ Hanya manajer yang bisa mengubah status promo.');
                return;
            }
            if (!confirm('Ubah status promo ini?')) return;
            try {
                const promo = allPromos.find(p => p.id === id);
                if (!promo) return;
                await db.collection('promos').doc(id).update({
                    isActive: promo.isActive === false ? true : false,
                    updatedAt: new Date().toISOString()
                });
                await loadPromos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deletePromo(id) {
            if (currentUser?.role !== 'manajer') {
                alert('⚠️ Hanya manajer yang bisa menghapus promo.');
                return;
            }
            if (!confirm('Yakin ingin menghapus promo ini?')) return;
            try {
                await db.collection('promos').doc(id).delete();
                await loadPromos();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ============================================================
        // DATE DISPLAY
        // ============================================================
        document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('id-ID', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        console.log('✅ Promo with approval loaded successfully!');
    </script>
</body>
</html>
