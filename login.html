<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chick Point</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/batik-pattern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ===== THEME TOGGLE ===== */
        .btn-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--accent);
            color: var(--text-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .btn-theme-toggle:hover {
            background: var(--accent);
            color: white;
            transform: rotate(15deg);
        }
        body.dark-mode .btn-theme-toggle {
            border-color: #C9A84C;
            color: #C9A84C;
            background: #1e1e1e;
        }
        body.dark-mode .btn-theme-toggle:hover {
            background: #C9A84C;
            color: #121212;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201,168,76,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(201,168,76,0.06) 0%, transparent 50%),
                repeating-linear-gradient(30deg, transparent, transparent 8px, rgba(201,168,76,0.02) 8px, rgba(201,168,76,0.02) 9px),
                repeating-linear-gradient(-30deg, transparent, transparent 8px, rgba(201,168,76,0.02) 8px, rgba(201,168,76,0.02) 9px);
            padding: 20px;
            transition: background 0.3s;
        }
        body.dark-mode {
            background: #121212;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(201,168,76,0.08) 0%, transparent 50%),
                repeating-linear-gradient(30deg, transparent, transparent 8px, rgba(201,168,76,0.03) 8px, rgba(201,168,76,0.03) 9px),
                repeating-linear-gradient(-30deg, transparent, transparent 8px, rgba(201,168,76,0.03) 8px, rgba(201,168,76,0.03) 9px);
        }
        .login-container {
            background: white;
            padding: 40px 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--accent);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        body.dark-mode .login-container {
            background: #1e1e1e;
            border-color: #333;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-container .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary);
            transition: color 0.3s;
        }
        body.dark-mode .login-container .logo h1 {
            color: #C9A84C;
        }
        .login-container .logo p {
            color: #888;
            font-size: 14px;
        }
        body.dark-mode .login-container .logo p {
            color: #aaa;
        }
        .login-container .form-group {
            margin-bottom: 16px;
        }
        .login-container .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            transition: color 0.3s;
        }
        body.dark-mode .login-container .form-group label {
            color: #ddd;
        }
        .login-container .form-group .password-wrapper {
            position: relative;
        }
        .login-container .form-group .password-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
            background: white;
            color: var(--text-dark);
        }
        body.dark-mode .login-container .form-group .password-wrapper input {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .login-container .form-group .password-wrapper input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        body.dark-mode .login-container .form-group .password-wrapper input:focus {
            border-color: #C9A84C;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        .login-container .form-group .password-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 4px 8px;
            transition: 0.2s;
            border-radius: 6px;
        }
        body.dark-mode .login-container .form-group .password-wrapper .toggle-password {
            color: #aaa;
        }
        .login-container .form-group .password-wrapper .toggle-password:hover {
            color: var(--primary);
            background: var(--secondary);
        }
        body.dark-mode .login-container .form-group .password-wrapper .toggle-password:hover {
            color: #C9A84C;
            background: #2a2a2a;
        }
        .login-container .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: white;
            transition: 0.2s;
            appearance: auto;
            color: var(--text-dark);
        }
        body.dark-mode .login-container .form-group select {
            background: #2a2a2a;
            border-color: #444;
            color: #eee;
        }
        .login-container .form-group select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        body.dark-mode .login-container .form-group select:focus {
            border-color: #C9A84C;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
        }
        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        body.dark-mode .btn-login {
            background: #C9A84C;
            color: #121212;
        }
        .login-container .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,26,26,0.3);
        }
        body.dark-mode .btn-login:hover {
            background: #b8962a;
            box-shadow: 0 8px 24px rgba(201,168,76,0.3);
        }
        .login-container .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .login-container .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin: 10px 0;
            display: none;
        }
        .login-container .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }
        body.dark-mode .login-container .message.error {
            background: #3a1a1a;
            border-color: #5a2a2a;
            color: #f87171;
        }
        .login-container .message.success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }
        body.dark-mode .login-container .message.success {
            background: #1a3a2a;
            border-color: #2a5a3a;
            color: #4ade80;
        }
        .login-container .message.info {
            background: #dbeafe;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            display: block;
        }
        body.dark-mode .login-container .message.info {
            background: #1a2a3a;
            border-color: #1a3a5a;
            color: #60a5fa;
        }
        .login-container .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }
        body.dark-mode .login-container .register-link {
            color: #aaa;
        }
        .login-container .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        body.dark-mode .login-container .register-link a {
            color: #C9A84C;
        }
        .login-container .register-link a:hover {
            text-decoration: underline;
        }
        .ornament-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 20px;
        }
        .ornament-line::before,
        .ornament-line::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
        }
        body.dark-mode .ornament-line::before,
        body.dark-mode .ornament-line::after {
            background: linear-gradient(to right, transparent, #C9A84C, transparent);
        }
        .ornament-line .ornament {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        body.dark-mode .ornament-line .ornament {
            background: #C9A84C;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 16px;
            }
            .btn-theme-toggle {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- TOMBOL THEME TOGGLE -->
    <button class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="login-container batik-border">
        <div class="logo">
            <h1>🏮 Chick Point</h1>
            <p>Cloud Kitchen Management</p>
        </div>

        <div class="ornament-line">
            <span class="ornament"></span>
            <span style="font-size:12px;color:#888;">Login</span>
            <span class="ornament"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>🏪 Pilih Outlet <span style="color:#dc2626;">*</span></label>
                <select id="loginOutlet" required>
                    <option value="">-- Pilih Outlet --</option>
                </select>
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="masukkan@email.com" required>
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Masukkan password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Daftar Sekarang</a>
        </div>
    </div>

    <!-- ===== FIREBASE CDN ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAXxnQFVppkpLWfCMBk-pEEJxfqxiLNPxI",
            authDomain: "cloud-chickpoint.firebaseapp.com",
            projectId: "cloud-chickpoint",
            storageBucket: "cloud-chickpoint.firebasestorage.app",
            messagingSenderId: "794896593049",
            appId: "1:794896593049:web:ede71767d065b621dc0808"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').classList.remove('fa-moon');
            document.getElementById('themeIcon').classList.add('fa-sun');
        }

        // ============================================================
        // LOAD OUTLETS
        // ============================================================
        async function loadOutlets() {
            const select = document.getElementById('loginOutlet');
            try {
                const snapshot = await db.collection('outlets').get();
                if (snapshot.empty) {
                    select.innerHTML = '<option value="">-- Tidak ada outlet --</option>';
                    return;
                }
                select.innerHTML = '<option value="">-- Pilih Outlet --</option>';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = doc.id;
                    opt.textContent = data.name || 'Outlet ' + doc.id;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('❌ Error loading outlets:', error);
                select.innerHTML = '<option value="">-- Gagal memuat outlet --</option>';
            }
        }
        loadOutlets();

        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const outletId = document.getElementById('loginOutlet').value;
            const message = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            message.className = 'message';
            message.textContent = '';

            if (!outletId) {
                message.className = 'message error';
                message.textContent = '❌ Silakan pilih outlet terlebih dahulu!';
                return;
            }
            if (!email || !password) {
                message.className = 'message error';
                message.textContent = '❌ Mohon isi email dan password';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Memproses...';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    await auth.signOut();
                    message.className = 'message error';
                    message.textContent = '❌ Akun tidak terdaftar di sistem. Hubungi admin.';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
                    return;
                }
                const userData = userDoc.data();
                if (userData.isActive === false || userData.status === 'pending') {
                    await auth.signOut();
                    message.className = 'message error';
                    message.textContent = '❌ Akun Anda belum disetujui oleh manajemen.';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
                    return;
                }

                localStorage.setItem('selectedOutlet', outletId);
                localStorage.setItem('userRole', userData.role || '');
                localStorage.setItem('userName', userData.name || '');

                // ===== UPDATE LOGIN TIME =====
                if (typeof window.updateUserLoginTime === 'function') {
                    await window.updateUserLoginTime(user.uid);
                } else {
                    // Fallback: update langsung
                    await db.collection('users').doc(user.uid).update({
                        lastLogin: new Date().toISOString(),
                        status: 'active'
                    });
                }

                message.className = 'message success';
                message.textContent = '✅ Login berhasil! Mengalihkan...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Login error:', error.code);
                let errorMsg = '';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg = '❌ Email atau password salah';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = '❌ Terlalu banyak percobaan. Tunggu beberapa menit';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = '❌ Format email tidak valid';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = '❌ Koneksi internet bermasalah';
                } else {
                    errorMsg = '❌ Error: ' + error.message;
                }
                message.className = 'message error';
                message.textContent = errorMsg;
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
            }
        });

        // ============================================================
        // CEK SUDAH LOGIN
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                const message = document.getElementById('message');
                message.className = 'message info';
                message.textContent = 'ℹ️ Anda sudah login sebagai ' + user.email + '. Jika ingin masuk dengan akun lain, logout terlebih dahulu.';
            }
        });

        console.log('✅ Login page with dark mode loaded successfully!');
    </script>
</body>
</html>
